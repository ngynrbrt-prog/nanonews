name: Refresh NANONews
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tesztfutás, hivatalos kiadás vagy legfrissebb kiadás összefoglalóinak frissítése"
        required: true
        type: choice
        options:
          - test
          - official
          - reito-backfill
          - style-refresh
        default: test
  schedule:
    # Check styles every five minutes. The worker limits RSS collection to once per hour.
    # Target the start of the Budapest publication hours in winter and summer.
    - cron: '0 3,4,14,15 * * *'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
permissions:
  contents: write
concurrency:
  group: nanonews-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run and publish refresh rounds
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NANONEWS_MODE: ${{ inputs.mode }}
          NANONEWS_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          
          round_signal=$(mktemp)
          trap 'rm -f "$round_signal"' EXIT
          export NANONEWS_ROUND_SIGNAL="$round_signal"

          deadline=$((SECONDS + 55 * 60))
          while true; do
            next_round=$((SECONDS + 5 * 60))
            git pull --ff-only origin main
            : > "$round_signal"
            python refresh_news.py
            if ! git diff --quiet -- data/; then
              git add data/
              git commit -m "Refresh NANONews edition"
              for attempt in 1 2 3; do
                git pull --rebase origin main
                if git push origin HEAD:main; then
                  break
                fi
                if (( attempt == 3 )); then
                  exit 1
                fi
              done
            fi
          
            if [[ "$NANONEWS_EVENT" != schedule ]] || (( SECONDS >= deadline )); then
              break
            fi
            if [[ -s "$round_signal" ]]; then
              echo 'Style backfill advanced and work remains; starting the next round now.'
              continue
            fi
            if (( next_round >= deadline )); then
              break
            fi
            if (( next_round > SECONDS )); then
              sleep "$((next_round - SECONDS))"
            fi
          done
