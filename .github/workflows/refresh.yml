name: Refresh NANONews
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tesztfutás, hivatalos kiadás vagy hiányzó stílusok pótlása"
        required: true
        type: choice
        options:
          - test
          - official
          - reito-backfill
        default: test
  schedule:
    # Retry only missing Tolkien and Rejto rewrites for the latest issue every 5 minutes; official editions are created only in the local 06:00 and 17:00 hour windows.
    - cron: '2/5 * * * *'
permissions:
  contents: write
concurrency:
  group: nanonews-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build editions and rewrites
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NANONEWS_MODE: ${{ inputs.mode }}
        run: python refresh_news.py
      - name: Commit new edition
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add data/
            git commit -m "Refresh NANONews edition"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
