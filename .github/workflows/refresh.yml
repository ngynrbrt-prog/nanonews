name: Refresh NANONews
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tesztfutás vagy a legfrissebb kiadás összefoglalóinak frissítése"
        required: true
        type: choice
        options:
          - test
          - reito-backfill
          - style-refresh
        default: test
  schedule:
    # Check styles every five minutes. The worker limits RSS collection to once per hour.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
permissions:
  contents: write
concurrency:
  group: nanonews-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: RSS-gyűjtés és mentés
        if: github.event_name == 'schedule'
        run: timeout --kill-after=5s 7m bash .github/scripts/refresh-batch.sh collect 5m

      - name: Stílusok feldolgozása és mentése
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REQUEST_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            timeout --kill-after=5s 7m bash .github/scripts/refresh-batch.sh background 4m
          else
            timeout --kill-after=5s 7m bash .github/scripts/refresh-batch.sh "$REQUEST_MODE" 4m
          fi
