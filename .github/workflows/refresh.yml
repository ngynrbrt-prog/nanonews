name: Refresh NANONews
on:
  workflow_dispatch:
  schedule:
    # Retry missing rewrites every 5 minutes, offset from the top of the hour to reduce schedule delays.
    - cron: '2/5 * * * *'
permissions:
  contents: write
concurrency:
  group: nanonews-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build editions and rewrites
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python refresh_news.py
      - name: Commit new edition
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add data/
            git commit -m "Refresh NANONews edition"
            git push
          fi
